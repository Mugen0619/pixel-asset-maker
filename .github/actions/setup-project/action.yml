# プロジェクトごとの「道具の準備」。
# CI①(ci.yml)と CI③(claude-issue-implement.yml)の両方が、テストの前にこのファイルを呼び出す。
# プロジェクトで使う言語・ツールのインストール手順を、下の steps に書く。
#
# 書くときの注意:
#   - 各ステップに `shell: bash` が必要(composite action の決まり)。
#   - 外部のActionは、タグ(@v4 など)ではなくコミットSHAで固定する。タグは後から付け替えられるため。
#   - ダウンロードしたファイルは、チェックサム(改ざん検知用の値)を照合してから使う。
#   - バージョンは、プロジェクトの文書(PROJECT_CONTEXT.md / decisions.md)と同じ値に固定する。
name: Set up project
description: プロジェクトで使う言語・ツールを準備する(プロジェクトごとに書き換える)

runs:
  using: composite
  steps:
    # ひな形の初期状態。準備が必要な道具はまだない。技術構成が決まったら、このステップを置き換える。
    - name: No setup required yet
      shell: bash
      run: echo "道具の準備は不要です(.github/actions/setup-project/action.yml は未設定)。"

